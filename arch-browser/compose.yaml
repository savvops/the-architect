# Arch Browser: host networking so archd/noVNC/CDP bind host loopback and reach
# the host's arch-jev llama-server on 127.0.0.1:12345. Remote access: Tailscale Serve only.
services:
  arch-browser:
    build: .
    image: arch-browser:latest
    container_name: arch-browser
    network_mode: "host"
    environment:
      ARCH_RESOLUTION: ${ARCH_RESOLUTION:-1280x800}
      ARCH_BIND: ${ARCH_BIND:-127.0.0.1}
      ARCH_VNC_BIND: ${ARCH_VNC_BIND:-127.0.0.1}
      ARCH_TOKEN: ${ARCH_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      JEV_LOCAL_URL: ${JEV_LOCAL_URL:-http://127.0.0.1:12345}
      ARCH_TIER1_MODELS: ${ARCH_TIER1_MODELS:-qwen/qwen3.7-flash,deepseek/deepseek-v4-flash-0731}
      ARCH_TIER2_MODELS: ${ARCH_TIER2_MODELS:-deepseek/deepseek-chat}
    volumes:
      - ./profile:/data/profile
      - ./logs:/data/logs
      - ./downloads:/data/downloads
    shm_size: 1gb
    restart: unless-stopped