services:
  arch-browser:
    build: .
    image: arch-browser:latest
    container_name: arch-browser
    network_mode: "host"
    environment:
      ARCH_RESOLUTION: ${ARCH_RESOLUTION:-1280x800}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      JEV_LOCAL_URL: ${JEV_LOCAL_URL:-http://127.0.0.1:12345}
      ARCH_TIER1_MODEL: ${ARCH_TIER1_MODEL:-google/gemini-2.0-flash-lite-001}
      ARCH_TIER2_MODEL: ${ARCH_TIER2_MODEL:-deepseek/deepseek-chat}
    volumes:
      - ./profile:/data/profile
      - ./logs:/data/logs
    shm_size: 1gb
    restart: unless-stopped