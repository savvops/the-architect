<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arch Browser — The Architect</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: var(--card); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
    .title-group { display: flex; align-items: center; gap: 8px; }
    .badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .badge-human { background: rgba(34, 197, 94, 0.2); color: var(--success); border: 1px solid var(--success); }
    .badge-agent { background: rgba(56, 189, 248, 0.2); color: var(--accent); border: 1px solid var(--accent); }
    .badge-tier { background: rgba(148, 163, 184, 0.15); color: var(--muted); border: 1px solid var(--border); }
    .controls { display: flex; gap: 8px; align-items: center; }
    .btn { padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: 0.15s; }
    .btn-takeover { background: var(--danger); color: white; }
    .btn-takeover:hover { opacity: 0.9; }
    .btn-allow { background: var(--accent); color: #000; }
    .btn-allow:hover { opacity: 0.9; }
    .nav-bar { display: flex; gap: 6px; flex: 1; max-width: 500px; }
    .nav-input { flex: 1; background: #0b1120; border: 1px solid var(--border); color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 13px; }
    .viewport { flex: 1; position: relative; background: #000; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <strong>Arch Browser</strong>
      <span id="takeover-badge" class="badge badge-agent">Agents Allowed</span>
      <span id="tier-badge" class="badge badge-tier">Tier 0: Local Jev</span>
    </div>
    <div class="nav-bar">
      <input type="text" id="url-input" class="nav-input" placeholder="https://..." value="about:blank">
      <button class="btn btn-allow" onclick="navigate()">Go</button>
    </div>
    <div class="controls">
      <button id="takeover-btn" class="btn btn-takeover" onclick="toggleTakeover()">Take Over</button>
    </div>
  </header>
  <div class="viewport">
    <iframe id="vnc-frame" src="/vnc.html?autoconnect=true&resize=remote"></iframe>
  </div>

  <script>
    let isHuman = false;
    async function updateStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        isHuman = data.owner_takeover;
        const badge = document.getElementById('takeover-badge');
        const btn = document.getElementById('takeover-btn');
        if (isHuman) {
          badge.className = 'badge badge-human';
          badge.innerText = 'Human in Control';
          btn.className = 'btn btn-allow';
          btn.innerText = 'Allow Agents';
        } else {
          badge.className = 'badge badge-agent';
          badge.innerText = 'Agents Allowed';
          btn.className = 'btn btn-takeover';
          btn.innerText = 'Take Over';
        }
        if (data.url && data.url !== 'about:blank' && document.activeElement !== document.getElementById('url-input')) {
          document.getElementById('url-input').value = data.url;
        }
      } catch (e) {
        console.error("Status poll error", e);
      }
    }

    async function toggleTakeover() {
      const endpoint = isHuman ? '/api/release' : '/api/takeover';
      await fetch(endpoint, { method: 'POST' });
      await updateStatus();
    }

    async function navigate() {
      const url = document.getElementById('url-input').value;
      if (!url) return;
      await fetch('/api/goto', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
      await updateStatus();
    }

    setInterval(updateStatus, 3000);
    updateStatus();
  </script>
</body>
</html>
