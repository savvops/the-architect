<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arch Browser — The Architect</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --border:#334155; --text:#f8fafc; --muted:#94a3b8; --accent:#38bdf8; --danger:#ef4444; --success:#22c55e; --warn:#f59e0b; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    body { background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
    header { background:var(--card); border-bottom:1px solid var(--border); padding:8px 12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; }
    .row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .badge { padding:3px 8px; border-radius:12px; font-size:11px; font-weight:600; text-transform:uppercase; border:1px solid var(--border); color:var(--muted); }
    .human { color:var(--success); border-color:var(--success); }
    .agent { color:var(--accent); border-color:var(--accent); }
    .lease { color:var(--warn); border-color:var(--warn); }
    .err { color:var(--danger); border-color:var(--danger); }
    .btn { padding:6px 12px; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; border:none; }
    .btn-takeover { background:var(--danger); color:#fff; }
    .btn-allow { background:var(--accent); color:#000; }
    .btn-ghost { background:transparent; color:var(--text); border:1px solid var(--border); }
    .nav { display:flex; gap:6px; flex:1; min-width:220px; max-width:560px; }
    .nav input { flex:1; background:#0b1120; border:1px solid var(--border); color:#fff; padding:6px 10px; border-radius:6px; font-size:13px; }
    .viewport { flex:1; background:#000; }
    iframe { width:100%; height:100%; border:none; }
  </style>
</head>
<body>
  <header>
    <div class="row">
      <strong>Arch Browser</strong>
      <span id="mode" class="badge agent">Agents allowed</span>
      <span id="lease" class="badge" hidden></span>
      <span id="dialog" class="badge err" hidden></span>
    </div>
    <div class="nav">
      <button class="btn btn-ghost" onclick="post('/api/back')">&#8592;</button>
      <input id="url" placeholder="https://..." onkeydown="if(event.key==='Enter')go()">
      <button class="btn btn-allow" onclick="go()">Go</button>
    </div>
    <div class="row">
      <button id="toggle" class="btn btn-takeover" onclick="toggle()">Take over</button>
    </div>
  </header>
  <div class="viewport"><iframe id="vnc" title="Arch Browser desktop"></iframe></div>
  <script>
    // Token: open the dashboard once as  ...:8447/#token=XYZ  -> stored locally, stripped from the URL.
    const m = location.hash.match(/token=([^&]+)/);
    if (m) { localStorage.setItem('archToken', decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname); }
    const token = localStorage.getItem('archToken') || '';
    const headers = (json) => Object.assign(
      {'X-Arch-Actor': 'owner'},             // the dashboard is the owner's console
      token ? {'Authorization': 'Bearer ' + token} : {},
      json ? {'Content-Type': 'application/json'} : {});

    // noVNC is a separate origin: Tailscale Serve :8447 -> :6092, loopback :8901 -> :6080.
    const params = new URLSearchParams(location.search);
    const vncPort = params.get('vnc_port') || (location.port === '8447' ? '6092' : '6080');
    document.getElementById('vnc').src =
      `${location.protocol}//${location.hostname}:${vncPort}/vnc.html?autoconnect=true&resize=scale&reconnect=true`;

    let isHuman = false;
    async function post(path, body) {
      const r = await fetch(path, {method: 'POST', headers: headers(true), body: JSON.stringify(body || {})});
      const data = await r.json().catch(() => ({}));
      refresh();
      return data;
    }
    async function refresh() {
      const mode = document.getElementById('mode');
      try {
        const r = await fetch('/api/status', {headers: headers(false)});
        if (r.status === 401) { mode.className = 'badge err'; mode.textContent = 'Token needed (#token=...)'; return; }
        const d = await r.json();
        isHuman = !!d.owner_takeover;
        mode.className = 'badge ' + (isHuman ? 'human' : 'agent');
        mode.textContent = isHuman ? 'Human in control' : 'Agents allowed';
        const t = document.getElementById('toggle');
        t.className = 'btn ' + (isHuman ? 'btn-allow' : 'btn-takeover');
        t.textContent = isHuman ? 'Allow agents' : 'Take over';
        const l = document.getElementById('lease');
        l.hidden = !d.lease; if (d.lease) { l.className = 'badge lease'; l.textContent = 'Lease: ' + d.lease.holder; }
        const dl = document.getElementById('dialog');
        dl.hidden = !(d.dialog && !d.dialog.auto_handled); if (!dl.hidden) dl.textContent = 'Dialog: ' + d.dialog.type;
        const u = document.getElementById('url');
        if (d.url && document.activeElement !== u) u.value = d.url;
      } catch (e) { mode.className = 'badge err'; mode.textContent = 'archd unreachable'; }
    }
    function toggle() { post(isHuman ? '/api/release' : '/api/takeover'); }
    function go() { const url = document.getElementById('url').value.trim(); if (url) post('/api/goto', {url}); }
    setInterval(refresh, 3000); refresh();
  </script>
</body>
</html>
